name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      # ubuntu runner 已预装 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk）。
      # 这里只需接受 license 并补装所需组件；不要使用 android-actions/setup-android@v3，
      # 它会在新 runner 上尝试更新已废弃的 tools 包并失败。
      - name: Install SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"
          "$SDKMANAGER" --list_installed | head -40

      # 正式签名走 Secrets（可选）。未配置时 build.sh 会生成临时自签 keystore，
      # 此时每次构建的签名都不同，覆盖安装前需先卸载旧版。
      #
      # 需要的 Secrets：
      #   SIGNING_KEYSTORE_BASE64     base64(keystore 文件)
      #   SIGNING_KEYSTORE_PASSWORD   keystore 密码
      #   SIGNING_KEY_ALIAS           key 别名
      #   SIGNING_KEY_PASSWORD        key 密码
      #
      # 生成方式（在本机执行）：
      #   keytool -genkeypair -v -keystore launcher.keystore -alias launcher \
      #     -keyalg RSA -keysize 2048 -validity 10950 -dname "CN=..., OU=..., O=..., C=CN"
      #   base64 -w0 launcher.keystore > keystore.b64
      - name: Restore signing keystore
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # 注意：secrets 上下文不能用在工作流 if 条件里，所以在这里用 shell 判断
          if [ -n "$KS_B64" ]; then
            echo "检测到签名 Secrets，使用正式签名密钥"
            echo "$KS_B64" | base64 -d > launcher.keystore
            {
              echo "KS_ALIAS=$KS_ALIAS"
              echo "KS_STORE_PASS=$KS_PASS"
              echo "KS_KEY_PASS=$KS_KEY_PASS"
            } >> "$GITHUB_ENV"
          else
            echo "未配置签名 Secrets，build.sh 将生成临时自签密钥"
          fi

      - name: Build APK
        run: bash build.sh

      - name: Show APK info
        run: ls -lh out/AppSettingsLauncher.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          files: out/AppSettingsLauncher.apk
          generate_release_notes: true
